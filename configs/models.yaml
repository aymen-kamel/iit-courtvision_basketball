# Model registry used by courtvision.detection.registry.
# path: relative to <data_root>\checkpoints unless absolute.
# licensed: false = no licence from the author -> private benchmarking only (needs --allow-private).
# sha256: null = no published or recorded hash (a warning is logged).
# class_map: model class name -> CourtVision standard class (player, ball, rim, ball_in_basket, referee, holder).
#            Names are compared lower-case with '-' and '_' treated as spaces. Unlisted classes are dropped.
# Verification status of each entry: see MODEL_REGISTRY.md and environment/PHASE1_RECORD.md.
models:
  m1:
    description: OpenHoopVision RF-DETR Small basketball detector (amateur/youth footage)
    backend: rfdetr
    path: openhoopvision_core/rf-detr-basketball.pth
    sha256: 69409cbefc4b92c3cd194fb7f877c6e58e52548909e05e3b5467fe0e2fe188c5
    licensed: true
    licence_note: Apache-2.0 stated in the repository README; no LICENSE file
    class_map:
      player: player
      ball: ball
      rim: rim
      ball-in-basket: ball_in_basket
      referee: referee
      holder: holder

  g1:
